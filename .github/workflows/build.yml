name: Build

on:
  push:
    branches:
      - Genesis
  pull_request:
    branches:
      - Genesis

jobs:
  linux-cmake:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC strict
            cc: gcc
            sanitizer: OFF
          - name: Clang strict
            cc: clang
            sanitizer: OFF
          - name: Clang ASan and UBSan
            cc: clang
            sanitizer: ON

    env:
      CC: ${{ matrix.cc }}
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libargon2-dev libsqlite3-dev libssl-dev openssl libmaxminddb-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DSCRATCHIRCD_WARNINGS_AS_ERRORS=ON
          -DSCRATCHIRCD_ENABLE_SANITIZERS=${{ matrix.sanitizer }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
